# nginx-Konfiguration für mcp.recherche.histoirerurale.ch
#
# Ablage:  /etc/nginx/sites-available/mcp.recherche.histoirerurale.ch
# Aktivieren: ln -s ../sites-available/mcp.recherche.histoirerurale.ch /etc/nginx/sites-enabled/
# TLS:        certbot --nginx -d mcp.recherche.histoirerurale.ch
#
# Auslieferungs-Layout für statische Dateien:
#   /opt/afa-mcp/deploy/index.html
#   /opt/afa-mcp/deploy/robots.txt
#   /opt/afa-mcp/deploy/llms.txt
#   /opt/afa-mcp/deploy/well-known/oauth-protected-resource.json
#   /opt/afa-mcp/deploy/well-known/mcp.json
#   /opt/afa-mcp/deploy/well-known/agent-card.json

upstream afa_mcp {
    server 127.0.0.1:8766;
    keepalive 32;
}

# Accept-Header normalisieren (siehe entscheidsuche-mcp/Lessons-Learned).
map $http_accept $mcp_accept {
    default                  $http_accept;
    "~*text/event-stream"    $http_accept;
    ""                       "application/json, text/event-stream";
    "*/*"                    "application/json, text/event-stream";
    "~*application/json"     "application/json, text/event-stream";
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.recherche.histoirerurale.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.recherche.histoirerurale.ch;

    ssl_certificate     /etc/letsencrypt/live/mcp.recherche.histoirerurale.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.recherche.histoirerurale.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ------------------------------------------------------------------
    # STATIC ASSETS
    # ------------------------------------------------------------------
    location = / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 308 /mcp;
        }
        root /opt/afa-mcp/deploy;
        try_files /index.html =404;
    }

    location = /robots.txt {
        root /opt/afa-mcp/deploy;
        access_log off;
        log_not_found off;
    }
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
    location ~ ^/apple-touch-icon(-[0-9]+x[0-9]+)?(-precomposed)?\.png$ {
        access_log off;
        log_not_found off;
        return 204;
    }
    location = /llms.txt {
        default_type text/plain;
        alias /opt/afa-mcp/deploy/llms.txt;
        add_header Cache-Control "public, max-age=3600";
    }

    # ------------------------------------------------------------------
    # OAUTH-DISCOVERY
    # ------------------------------------------------------------------
    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        alias /opt/afa-mcp/deploy/well-known/oauth-protected-resource.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/oauth-protected-resource/mcp {
        default_type application/json;
        alias /opt/afa-mcp/deploy/well-known/oauth-protected-resource.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/oauth-authorization-server {
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_an_authorization_server","resource_metadata":"/.well-known/oauth-protected-resource"}';
    }
    location = /.well-known/oauth-authorization-server/mcp {
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_an_authorization_server","resource_metadata":"/.well-known/oauth-protected-resource"}';
    }
    location = /mcp/.well-known/oauth-authorization-server {
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_an_authorization_server","resource_metadata":"/.well-known/oauth-protected-resource"}';
    }

    # ------------------------------------------------------------------
    # MCP-/AGENT-DISCOVERY-MANIFESTE
    # ------------------------------------------------------------------
    location = /.well-known/mcp.json {
        default_type application/json;
        alias /opt/afa-mcp/deploy/well-known/mcp.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/agent.json {
        default_type application/json;
        alias /opt/afa-mcp/deploy/well-known/agent-card.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/agent-card.json {
        default_type application/json;
        alias /opt/afa-mcp/deploy/well-known/agent-card.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/ai-plugin.json {
        default_type application/json;
        alias /opt/afa-mcp/deploy/well-known/mcp.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /agent { return 308 /.well-known/agent-card.json; }
    location = /agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /agent.json { return 308 /.well-known/agent.json; }
    location = /v1/agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /v1/agent.json { return 308 /.well-known/agent.json; }
    location = /v2/agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /api/agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /api/agent.json { return 308 /.well-known/agent.json; }
    location = /agents/agent-card.json { return 308 /.well-known/agent-card.json; }

    # FastMCP-eigene Routen durchreichen
    location ^~ /.well-known/mcp {
        proxy_pass http://afa_mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ------------------------------------------------------------------
    # PFAD-REDIRECTS
    # ------------------------------------------------------------------
    location = /sse              { return 308 /mcp; }
    location = /mcp/sse          { return 308 /mcp; }
    location = /mcp/mcp          { return 308 /mcp; }
    location = /mcp/v1/mcp       { return 308 /mcp; }
    location = /mcp/api/mcp      { return 308 /mcp; }
    location = /mcp/openapi.json { return 308 /.well-known/mcp.json; }

    # ------------------------------------------------------------------
    # HEALTHCHECK
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------------------
    # MCP-ENDPUNKT (Streamable HTTP)
    # ------------------------------------------------------------------
    location /mcp {
        proxy_set_header Accept $mcp_accept;
        proxy_pass http://afa_mcp;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 30s;

        client_max_body_size 4m;
    }

    access_log /var/log/nginx/mcp.recherche.histoirerurale.ch.access.log;
    error_log  /var/log/nginx/mcp.recherche.histoirerurale.ch.error.log warn;
}
